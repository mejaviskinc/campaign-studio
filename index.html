<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Campaign Studio</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f6f6f3}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#fff,#e9e9e4)}.card{background:#fff;border:1px solid #e3e3df;border-radius:22px;box-shadow:0 24px 70px #00000010}.auth-card{width:min(100%,420px);padding:30px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#dc4c8b,#f0a04b);color:white;font-size:24px}.auth h1{margin:18px 0 8px}.muted{color:#777;font-size:14px;line-height:1.5}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0;font-size:12px;color:#666}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px 12px;background:#fcfcfb;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#999}.btn{border:0;border-radius:11px;padding:10px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.primary{background:#111;color:#fff}.btn.secondary{background:#efefec;color:#222}.btn.danger{background:#fff0f0;color:#9c3434}.btn.full{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{margin:12px 0;padding:10px 12px;border-radius:11px;background:#f1f1ee;font-size:12px;color:#555}.error{background:#fff0f0;color:#983737}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#111;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:0 7px}.brand .mini{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#dc4c8b,#f0a04b)}.brand div:last-child{display:flex;flex-direction:column;line-height:1.05}.brand span{opacity:.55;font-size:12px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#aaa;padding:11px 12px;border-radius:12px;text-align:left}.nav button.active,.nav button:hover{background:#252525;color:#fff}.logout{margin-top:auto}.main{min-width:0}.topbar{padding:26px 30px 18px;display:flex;justify-content:space-between;align-items:center}.topbar h2{margin:0 0 5px}.chip{background:#fff;border:1px solid #e4e4df;border-radius:999px;padding:9px 12px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}.dot.ok{background:#24a064}.grid{display:grid;grid-template-columns:minmax(300px,370px) 1fr;gap:20px;padding:0 30px 30px}.panel{padding:20px}.panel h3{margin:4px 0 14px;font-size:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.file{display:block;border:1px dashed #c9c9c2;border-radius:12px;padding:12px;margin-bottom:12px;background:#fafaf8;font-size:12px;cursor:pointer}.file input{display:none}.buttons{display:flex;gap:8px;flex-wrap:wrap}.preview-head{display:flex;justify-content:space-between;margin:0 4px 10px;font-size:12px;color:#777}.stage{background:radial-gradient(circle at top,#eeeeea,#dadad4);border:1px solid #ddd;border-radius:20px;padding:26px;min-height:calc(100vh - 145px);display:grid;place-items:center;overflow:auto}.canvas{position:relative;width:min(100%,620px);aspect-ratio:4/5;background:#eadfce;overflow:hidden;border-radius:6px;box-shadow:0 30px 80px #0002;isolation:isolate}.orb{position:absolute;border-radius:50%;opacity:.52;z-index:-1}.orb.a{width:65%;aspect-ratio:1;background:white;right:-15%;top:-12%}.orb.b{width:55%;aspect-ratio:1;background:#b89c7d66;left:-16%;bottom:-12%}.canvas-logo{position:absolute;top:6%;left:7%;width:16%;max-height:9%;object-fit:contain}.copy{position:absolute;left:7%;top:18%;width:53%;color:#28231f}.eyebrow{font-size:11px;letter-spacing:.22em;font-weight:700;color:#7b5c3e}.copy h1{font-size:clamp(34px,5vw,58px);line-height:.98;margin:10px 0 15px;max-width:9ch}.copy p{font-size:clamp(12px,1.5vw,17px);line-height:1.5;color:#4b443e}.mini-cta{display:inline-block;border:1px solid #3f3933;border-radius:999px;padding:8px 14px;margin-top:8px;font-size:11px}.product{position:absolute;right:-2%;bottom:6%;width:55%;height:69%;object-fit:contain;filter:drop-shadow(0 24px 22px #0003)}.placeholder{position:absolute;right:9%;bottom:18%;width:34%;aspect-ratio:1/1.25;border:1px dashed #887b70;border-radius:18px;display:grid;place-items:center;color:#75695f;font-size:12px}.foot{position:absolute;left:7%;right:7%;bottom:4%;font-size:9px;letter-spacing:.13em;color:#635a52}.content{margin:0 30px 30px;padding:22px}.rows{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:14px;border:1px solid #ecece8;border-radius:15px;padding:12px}.thumb{width:62px;height:62px;border-radius:12px;background:#eee;overflow:hidden;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.grow p{margin:5px 0;color:#666;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;padding:4px 7px;border-radius:999px;background:#eee;margin-left:8px}.status-published{background:#e7f6ed;color:#267044}.status-scheduled{background:#eaf1ff;color:#2857a5}.status-failed{background:#ffeaea;color:#a13636}.actions{display:flex;gap:6px}.actions button{border:0;border-radius:9px;padding:8px}.timeline{display:flex;flex-direction:column;gap:12px}.timeline-item{border-left:2px solid #111;padding:2px 0 12px 14px}.settings{max-width:760px}.connected{display:flex;gap:12px;align-items:center;border:1px solid #dfe9e2;background:#f5fbf7;border-radius:14px;padding:14px;margin:18px 0}.connected .grow{display:flex;flex-direction:column}.loading{padding:50px;text-align:center;color:#777}
@media(max-width:900px){.app{grid-template-columns:76px 1fr}.brand div:last-child,.nav button span{display:none}.nav button{text-align:center}.grid{grid-template-columns:1fr}.stage{min-height:auto}.topbar,.grid{padding-left:20px;padding-right:20px}.content{margin-left:20px;margin-right:20px}.chip{display:none}}
@media(max-width:620px){.app{display:block}.sidebar{position:fixed;z-index:10;left:0;right:0;bottom:0;top:auto;height:68px;flex-direction:row;align-items:center;padding:9px 12px}.brand{display:none}.nav{flex:1;flex-direction:row;justify-content:space-around}.nav button{padding:10px 9px;font-size:11px}.logout{margin:0}.topbar{padding:18px 16px}.grid{padding:0 16px 90px}.content{margin:0 16px 90px}.stage{padding:14px}.two{grid-template-columns:1fr}.copy h1{font-size:34px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2'
import { toJpeg, toPng } from 'https://esm.sh/html-to-image@1.11.13'

const SUPABASE_URL='https://iyhwephcrxeqwiemhppw.supabase.co'
const SUPABASE_KEY='sb_publishable_0QZOXv00GKp6ecUi2L-FLA_YvsQrzy3'
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY)
const root=document.getElementById('root')
let session=null, campaigns=[], connection=null, tab='editor'
const state={format:'4/5',title:'Glow Up, Show Up',subtitle:'Simple routine. Visible confidence.',caption:'Rawat kulitmu setiap hari bersama Mejavi Skin+. ✨\n\n#MejaviSkinPlus #SkincareRoutine',bg:'#eadfce',accent:'#7b5c3e',photo:'',logo:'',scheduled:''}

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
const fmt=v=>v?new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'Belum dijadwalkan'
const status=s=>'<span class="status status-'+esc(s)+'">'+({draft:'Draft',scheduled:'Terjadwal',publishing:'Mengirim',published:'Terkirim',failed:'Gagal'}[s]||esc(s))+'</span>'

async function init(){
 const {data}=await supabase.auth.getSession(); session=data.session
 supabase.auth.onAuthStateChange((_e,s)=>{session=s;render();if(s)loadData()})
 render(); if(session) await loadData()
 const q=new URLSearchParams(location.search); if(q.get('instagram')){history.replaceState({},'',location.pathname); setTimeout(()=>alert(q.get('instagram')==='connected'?'Instagram berhasil terhubung.':decodeURIComponent(q.get('message')||'Koneksi Instagram gagal.')),200)}
}
async function loadData(){
 const [a,b]=await Promise.all([supabase.from('campaigns').select('*').order('created_at',{ascending:false}),supabase.from('instagram_connections').select('*').maybeSingle()])
 campaigns=a.data||[];connection=b.data||null;render()
}
function render(){
 if(!session){root.innerHTML=authView();bindAuth();return}
 root.innerHTML=appView();bindApp()
}
function authView(){return '<div class="auth"><div class="card auth-card"><div class="logo">◎</div><h1>Campaign Studio</h1><p class="muted">Edit campaign, simpan draft, jadwalkan, dan publish Instagram dari satu dashboard.</p><form id="authForm"><label class="field">Email<input id="email" type="email" required placeholder="nama@brand.com"></label><label class="field">Password<input id="password" type="password" minlength="6" required placeholder="••••••••"></label><div id="authMsg"></div><button class="btn primary full" id="loginBtn">Masuk</button><button type="button" class="btn secondary full" id="signupBtn" style="margin-top:8px">Buat akun baru</button></form></div></div>'}
function bindAuth(){
 document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();msg('authMsg','Memproses...');const {error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg('authMsg',error.message,true)}
 document.getElementById('signupBtn').onclick=async()=>{msg('authMsg','Membuat akun...');const {data,error}=await supabase.auth.signUp({email:email.value,password:password.value,options:{emailRedirectTo:location.href.split('?')[0]}});if(error)return msg('authMsg',error.message,true);msg('authMsg',data.session?'Akun dibuat dan Anda sudah masuk.':'Akun dibuat. Cek email untuk konfirmasi.')}
}
function appView(){
 const title=tab==='editor'?'Campaign Editor':tab==='campaigns'?'Semua Campaign':tab==='calendar'?'Kalender Konten':'Integrasi Instagram'
 return '<div class="app"><aside class="sidebar"><div class="brand"><div class="mini">◎</div><div><b>Campaign</b><span>Studio</span></div></div><div class="nav">'+nav('editor','✦','Editor')+nav('campaigns','▦','Campaign')+nav('calendar','◷','Kalender')+nav('instagram','◎','Instagram')+'</div><button class="btn secondary logout" id="logout">↪</button></aside><main class="main"><header class="topbar"><div><h2>'+title+'</h2><p class="muted">Kelola konten brand lebih cepat dan konsisten.</p></div><div class="chip"><span class="dot '+(connection?'ok':'')+'"></span>'+(connection?'@'+esc(connection.username):'Instagram belum terhubung')+'</div></header>'+bodyView()+'</main></div>'
}
const nav=(id,icon,label)=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+icon+' <span>'+label+'</span></button>'
function bodyView(){if(tab==='editor')return editorView();if(tab==='campaigns')return campaignsView();if(tab==='calendar')return calendarView();return instagramView()}
function editorView(){
 const ratio=state.format==='1/1'?'1/1':state.format==='9/16'?'9/16':'4/5'
 return '<section class="grid"><div class="card panel"><h3>Konten</h3><label class="field">Format<select id="format"><option value="1/1" '+(state.format==='1/1'?'selected':'')+'>Feed 1:1</option><option value="4/5" '+(state.format==='4/5'?'selected':'')+'>Feed 4:5</option><option value="9/16" '+(state.format==='9/16'?'selected':'')+'>Story / Reels 9:16</option></select></label><label class="field">Judul<input id="title" value="'+esc(state.title)+'"></label><label class="field">Subjudul<textarea id="subtitle" rows="3">'+esc(state.subtitle)+'</textarea></label><div class="two"><label class="field">Background<input id="bg" type="color" value="'+state.bg+'"></label><label class="field">Aksen<input id="accent" type="color" value="'+state.accent+'"></label></div><label class="file">Upload foto produk<input id="photo" type="file" accept="image/*"></label><label class="file">Upload logo PNG<input id="logoFile" type="file" accept="image/*"></label><h3>Caption</h3><label class="field"><textarea id="caption" rows="7">'+esc(state.caption)+'</textarea></label><label class="field">Jadwal posting<input id="scheduled" type="datetime-local" value="'+esc(state.scheduled)+'"></label><div id="editorMsg"></div><div class="buttons"><button class="btn secondary" id="download">PNG</button><button class="btn secondary" id="draft">Simpan Draft</button><button class="btn primary" id="schedule" '+(!connection||state.format==='9/16'?'disabled':'')+'>Jadwalkan</button></div><p class="muted" style="font-size:12px;margin-top:12px">'+(!connection?'Hubungkan Instagram terlebih dahulu untuk menjadwalkan posting. ':'' )+(state.format==='9/16'?'Format 9:16 saat ini untuk edit/export; auto-post gambar memakai 1:1 atau 4:5.':'')+'</p></div><div><div class="preview-head"><b>Preview</b><span>'+ratio+'</span></div><div class="stage"><div class="canvas" id="canvas" style="aspect-ratio:'+ratio+';background:'+state.bg+'"><div class="orb a"></div><div class="orb b" style="background:'+state.accent+'55"></div>'+(state.logo?'<img class="canvas-logo" src="'+state.logo+'">':'')+'<div class="copy"><div class="eyebrow" style="color:'+state.accent+'">MEJAVI SKIN+</div><h1>'+esc(state.title)+'</h1><p>'+esc(state.subtitle)+'</p><div class="mini-cta">Discover your glow</div></div>'+(state.photo?'<img class="product" src="'+state.photo+'">':'<div class="placeholder">Upload foto produk</div>')+'<div class="foot">SKINCARE • DAILY ROUTINE • CONFIDENCE</div></div></div></div></section>'
}
function campaignsView(){return '<section class="card content"><h3>Campaign</h3><p class="muted">Draft, jadwal, dan riwayat posting.</p><div class="rows">'+(campaigns.length?campaigns.map(c=>'<div class="row"><div class="thumb">'+(c.asset_url?'<img src="'+esc(c.asset_url)+'">':'✦')+'</div><div class="grow"><b>'+esc(c.title)+'</b>'+status(c.status)+'<p>'+esc(c.caption)+'</p><small>'+fmt(c.scheduled_for)+'</small></div><div class="actions">'+(['draft','scheduled','failed'].includes(c.status)?'<button data-publish="'+c.id+'">Kirim</button>':'')+'<button data-delete="'+c.id+'">Hapus</button></div></div>').join(''):'<div class="notice">Belum ada campaign.</div>')+'</div></section>'}
function calendarView(){const x=campaigns.filter(c=>c.scheduled_for).sort((a,b)=>new Date(a.scheduled_for)-new Date(b.scheduled_for));return '<section class="card content"><h3>Jadwal terdekat</h3><p class="muted">Waktu mengikuti zona waktu browser Anda.</p><div class="timeline">'+(x.length?x.map(c=>'<div class="timeline-item"><small>'+fmt(c.scheduled_for)+'</small><h4>'+esc(c.title)+'</h4>'+status(c.status)+'</div>').join(''):'<div class="notice">Belum ada konten terjadwal.</div>')+'</div></section>'}
function instagramView(){return '<section class="card content settings"><div class="logo">◎</div><h3 style="margin-top:18px">Instagram Professional</h3><p class="muted">Hubungkan akun Instagram Business atau Creator untuk mengizinkan aplikasi mem-publish konten organik.</p>'+(connection?'<div class="connected"><div>✓</div><div class="grow"><b>@'+esc(connection.username)+'</b><span class="muted">Terhubung • token disimpan di backend</span></div><button class="btn secondary" id="disconnect">Putuskan</button></div>':'<button class="btn primary" id="connect">Hubungkan Instagram</button>')+'<div id="igMsg"></div><h4 style="margin-top:28px">Yang dibutuhkan</h4><ol class="muted"><li>Instagram Business/Creator.</li><li>Meta App dengan Instagram API + Instagram Login.</li><li>Permission instagram_business_basic dan instagram_business_content_publish.</li></ol></section>'}
function bindApp(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})
 document.getElementById('logout').onclick=()=>supabase.auth.signOut()
 if(tab==='editor')bindEditor()
 if(tab==='campaigns'){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeCampaign(b.dataset.delete));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>publishNow(b.dataset.publish))}
 if(tab==='instagram')bindInstagram()
}
function bindEditor(){
 const live=(id,key,rerender=false)=>{const el=document.getElementById(id);el.oninput=()=>{state[key]=el.value;if(rerender)render();else updatePreview()}}
 live('format','format',true);live('title','title');live('subtitle','subtitle');live('caption','caption');live('bg','bg');live('accent','accent');live('scheduled','scheduled')
 const file=(id,key)=>document.getElementById(id).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{state[key]=x.target.result;render()};r.readAsDataURL(f)}
 file('photo','photo');file('logoFile','logo')
 document.getElementById('download').onclick=downloadPng
 document.getElementById('draft').onclick=()=>saveCampaign('draft')
 document.getElementById('schedule').onclick=()=>saveCampaign('scheduled')
}
function updatePreview(){const c=document.getElementById('canvas');if(!c)return;c.style.background=state.bg;render()}
async function downloadPng(){const data=await toPng(document.getElementById('canvas'),{cacheBust:true,pixelRatio:2});const a=document.createElement('a');a.href=data;a.download='campaign-'+Date.now()+'.png';a.click()}
async function saveCampaign(mode){
 if(mode==='scheduled'&&!state.scheduled)return msg('editorMsg','Pilih jadwal posting terlebih dahulu.',true)
 if(mode==='scheduled'&&state.format==='9/16')return msg('editorMsg','Gunakan format 1:1 atau 4:5 untuk auto-post image feed.',true)
 if(state.caption.length>2200)return msg('editorMsg','Caption maksimal 2.200 karakter.',true)
 const tags=(state.caption.match(/(^|\s)#[\p{L}\p{N}_]+/gu)||[]).length;if(tags>30)return msg('editorMsg','Hashtag maksimal 30.',true)
 try{
  msg('editorMsg','Menyimpan...')
  const data=await toJpeg(document.getElementById('canvas'),{cacheBust:true,pixelRatio:2,quality:.94,backgroundColor:state.bg})
  const blob=await (await fetch(data)).blob();const path=session.user.id+'/'+crypto.randomUUID()+'.jpg'
  const up=await supabase.storage.from('campaign-media').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error
  const pub=supabase.storage.from('campaign-media').getPublicUrl(path).data.publicUrl
  const ins=await supabase.from('campaigns').insert({user_id:session.user.id,title:state.title,caption:state.caption,asset_url:pub,status:mode,scheduled_for:mode==='scheduled'?new Date(state.scheduled).toISOString():null,design_json:{format:state.format,title:state.title,subtitle:state.subtitle,bg:state.bg,accent:state.accent}})
  if(ins.error)throw ins.error;msg('editorMsg',mode==='scheduled'?'Campaign berhasil dijadwalkan.':'Draft berhasil disimpan.');await loadData()
 }catch(e){msg('editorMsg','Gagal: '+e.message,true)}
}
async function removeCampaign(id){if(!confirm('Hapus campaign ini?'))return;await supabase.from('campaigns').delete().eq('id',id);await loadData()}
async function publishNow(id){const {data,error}=await supabase.functions.invoke('instagram-publish',{body:{campaign_id:id}});alert(error?.message||data?.error||'Campaign diproses.');await loadData()}
function bindInstagram(){
 const c=document.getElementById('connect');if(c)c.onclick=async()=>{msg('igMsg','Membuka Instagram...');const {data,error}=await supabase.functions.invoke('instagram-oauth',{body:{action:'start'}});if(error||data?.error)return msg('igMsg',error?.message||data.error,true);location.href=data.url}
 const d=document.getElementById('disconnect');if(d)d.onclick=async()=>{const {data,error}=await supabase.functions.invoke('instagram-oauth',{body:{action:'disconnect'}});if(error||data?.error)return msg('igMsg',error?.message||data.error,true);await loadData()}
}
function msg(id,text,isError=false){const el=document.getElementById(id);if(el)el.innerHTML='<div class="notice '+(isError?'error':'')+'">'+esc(text)+'</div>'}
init()
</script>
</body>
</html>
